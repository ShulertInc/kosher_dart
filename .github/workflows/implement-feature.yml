name: Implement from Issue
on:
  issue_comment:
    types: [created]

jobs:
  implement:
    if: |
      contains(github.event.comment.body, '@claude implement') &&
      github.event.comment.user.login == 'yakir8'
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Implement the feature or fix described in this issue.
            Follow all guidelines defined in CLAUDE.md.
            Create a new branch with the prefix feature/ or fix/,
            write the code, add documentation, and open a PR.